name: nyanko-blog-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: nyanko_blog
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d nyanko_blog"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
