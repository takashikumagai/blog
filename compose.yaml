services:
  postgres:
    image: postgres:18-alpine
    container_name: nyanko-blog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: nyanko_blog
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d nyanko_blog"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://blog:${POSTGRES_PASSWORD}@postgres:5432/nyanko_blog
      BLOG_SYNC_TOKEN: ${BLOG_SYNC_TOKEN:?set in .env}
      BNS_PORT: 3210
      RUST_LOG: nyanko_blog=info
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # frontend:
  #   build: ./frontend
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:8080:8080"
  #   depends_on: [backend]

volumes:
  postgres_data:
